plugins {
    id 'spotifybackup.java-application-conventions'
    id 'application'
    id 'java'
    id 'extra-java-module-info'
    id "org.hibernate.orm" version "6.4.9.Final"
}

dependencies {
    implementation(
            'org.apache.commons:commons-text:1.11.0',
            'commons-codec:commons-codec:1.17.0',
            'org.hibernate.orm:hibernate-core:6.4.9.Final',
            'org.hibernate.orm:hibernate-jpamodelgen:6.4.9.Final',
            'org.hibernate.orm:hibernate-hikaricp:6.4.9.Final',
            'io.hypersistence:hypersistence-utils-hibernate-63:3.7.6',
            'org.projectlombok:lombok:1.18.32',
            'com.h2database:h2:2.2.224',
            'org.slf4j:slf4j-nop:2.0.13',
            'se.michaelthelin.spotify:spotify-web-api-java:8.3.6',
            'com.neovisionaries:nv-i18n:1.29',
            'org.jline:jline:3.26.2'
    )
    annotationProcessor(
            'org.projectlombok:lombok:1.18.32',
            'org.hibernate.orm:hibernate-jpamodelgen:6.4.9.Final'
    )
}

extraJavaModuleInfo {
    module("nv-i18n-1.29.jar", "nv.i18n", "1.29") {
        exports("com.neovisionaries.i18n")
    }
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(22)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'spotifybackup.app.App'
    applicationDefaultJvmArgs = ['-Dgreeting.language=en']
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass
    }
    archiveBaseName = rootProject.name
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
